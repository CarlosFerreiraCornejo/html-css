<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <label for="icor">Cor</label>
        <input type="color" name="cor" id="icor" value="#00ff00">
        <fieldset>
            <legend>Medidor</legend>
            <label for="isat">Nível de Satisfação</label>
            <input type="range" name="sat" id="isat" min="1" max="5" value="2">
        </fieldset>
        <fieldset>
            <legend>Upload</legend>
            <label for="ifoto">Fodo do perfil</label>
            <input type="file" name="foto" id="ifoto">
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
